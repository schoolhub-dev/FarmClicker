<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12180f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Пиксельный кликер про ферму: тапай грядку, выращивай урожай, продавай на рынке и качай хозяйство.">
  <title>Ферма Пикселей</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    /* ===== БАЗА: тёмная тема, аккуратные шрифты, скругления ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    :root {
      --bg: #12180f; --bg2: #0d1209; --panel: #1c2716; --panel2: #26361f;
      --line: #35482a; --green: #86e05a; --gold: #ffd95e; --txt: #e2edd3;
      --dim: #94a67f; --red: #ff6b5e;
      --mono: 'Consolas', 'Menlo', 'Courier New', monospace;
      --ui: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: var(--bg);
      font-family: var(--ui); color: var(--txt);
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
    }
    body { display: flex; flex-direction: column; }
    #app { flex: 1 1 auto; display: flex; min-height: 0; }

    /* ---- ЛЕВАЯ ЧАСТЬ ---- */
    #left {
      flex: 1 1 auto; min-width: 0; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 16px 16px 24px;
    }
    #topbar { position: relative; width: 100%; display: flex; justify-content: center; }
    #counter { text-align: center; }
    #counter .num {
      font-family: var(--mono); font-weight: 800; color: var(--gold);
      font-size: clamp(32px, 7.5vw, 58px); line-height: 1.05;
      text-shadow: 3px 3px 0 #000; letter-spacing: -1px;
    }
    #counter .num .cur { opacity: .8; margin-right: 6px; }
    #counter .sub { margin-top: 5px; color: var(--dim); font-size: clamp(12.5px, 2.6vw, 15px); }
    #counter .sub b { color: var(--green); font-weight: 700; }
    #btnSettings {
      position: absolute; right: 0; top: 0; width: 42px; height: 42px; font-size: 19px;
      border: 2px solid var(--line); border-radius: 10px; background: var(--panel2);
      color: var(--txt); cursor: pointer;
    }
    #btnSettings:active { transform: translateY(1px); }

    #gardenBtn {
      position: relative; display: block; padding: 0; margin: 0;
      width: min(580px, 94vw); background: #101a12;
      border: 3px solid var(--line); border-radius: 12px; cursor: pointer;
      overflow: hidden; box-shadow: 0 0 0 3px #060804, 0 9px 0 #060804;
      transition: transform .04s ease, box-shadow .04s ease;
    }
    #gardenBtn:active { transform: translateY(3px); box-shadow: 0 0 0 3px #060804, 0 6px 0 #060804; filter: brightness(1.07); }
    #garden { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
    #floats { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .float {
      position: absolute; transform: translate(-50%, -50%); font-family: var(--mono);
      font-weight: 800; color: var(--gold); text-shadow: 2px 2px 0 #000;
      font-size: 17px; white-space: nowrap; pointer-events: none;
      animation: fl .8s ease-out forwards;
    }
    @keyframes fl { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, -190%) scale(1.15); } }

    #gardenInfo {
      background: rgba(10, 16, 8, .8); border: 2px solid var(--line); border-radius: 6px;
      padding: 6px 12px; font-size: 13px; color: var(--green); font-weight: 700; text-align: center;
    }

    #harvestWrap { width: min(580px, 94vw); }
    .hbar { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--dim); margin-bottom: 5px; }
    .hbar b { color: var(--green); }
    .track { height: 15px; background: #0d1209; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
    .track i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #3f6f2a, #86e05a); transition: width .12s linear; }
    #btnSell { margin-top: 8px; width: 100%; }
    /* Уровень/вместимость/цена амбара видны в карточке улучшения «Амбар» в магазине,
       чтобы главный экран оставался чистым: счётчик, грядка, шкала амбара, кнопка продажи. */

    /* ---- ПРАВАЯ ЧАСТЬ: магазин ---- */
    #shop {
      flex: 0 0 auto; width: 380px; min-height: 0; background: var(--bg2);
      border-left: 3px solid var(--line); display: flex; flex-direction: column;
    }
    #shopHead {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 3px solid var(--line); background: #16210f;
    }
    #shopHead h2 { flex: 1 1 auto; font-size: 13.5px; letter-spacing: 2px; color: var(--gold); }
    #shopList { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 20px; }
    #shopList::-webkit-scrollbar { width: 10px; }
    #shopList::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

    .sec { font-size: 11.5px; letter-spacing: 1.5px; color: var(--gold); opacity: .85; margin: 14px 4px 7px; }
    .sec:first-child { margin-top: 2px; }

    .item {
      display: flex; gap: 11px; align-items: center; padding: 9px 11px; margin-bottom: 7px;
      background: var(--panel); border: 2px solid var(--line); border-radius: 8px;
      cursor: pointer; transition: background .1s, border-color .1s;
    }
    .item:hover { background: var(--panel2); border-color: #4c613a; }
    .item:active { transform: translateY(1px); }
    .item .ic { flex: 0 0 auto; width: 34px; text-align: center; font-size: 24px; line-height: 1; }
    .item .meta { flex: 1 1 auto; min-width: 0; }
    .item .nm { font-size: 13.5px; font-weight: 700; }
    .item .lv { color: var(--green); font-size: 11.5px; font-weight: 700; }
    .item .eff { color: var(--dim); font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
    .item .price { flex: 0 0 auto; color: var(--gold); font-family: var(--mono); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .item.owned { border-color: var(--green); background: #1e3016; }
    .item.on { border-color: var(--gold); box-shadow: inset 0 0 0 2px #6b5a1c; }
    .item.on .price { color: var(--gold); }
    .item.owned .price { color: var(--green); }
    .item.no { opacity: .45; cursor: default; }
    .item.no:hover { background: var(--panel); border-color: var(--line); }

    .btn {
      min-height: 42px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 8px;
      background: var(--panel2); color: var(--txt); font-family: inherit; font-size: 13px;
      font-weight: 700; cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }
    .btn.pri { background: #2f5a1f; border-color: var(--green); color: var(--green); }
    .btn.gold { background: #5a4a12; border-color: var(--gold); color: var(--gold); }
    .btn.danger { background: #5a1d16; border-color: var(--red); color: var(--red); }
    .btn.ghost { background: transparent; color: var(--dim); }
    .btn:disabled { opacity: .45; cursor: default; }

    #modalWrap {
      position: fixed; inset: 0; background: rgba(6, 10, 5, .85); z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    #modal {
      width: 100%; max-width: 440px; background: var(--panel); border: 3px solid var(--gold);
      border-radius: 10px; padding: 16px; max-height: 86vh; overflow-y: auto;
      box-shadow: 0 0 0 3px #000, 0 0 34px rgba(255, 217, 94, .2);
    }
    #mTitle { font-size: 15px; color: var(--gold); margin-bottom: 10px; letter-spacing: 1px; }
    #mBody { font-size: 13.5px; line-height: 1.6; }
    #mBody .who { color: var(--green); font-weight: 700; margin-bottom: 4px; }
    #mBody .stats { margin-top: 10px; font-size: 12.5px; color: var(--dim); line-height: 1.75; }
    #mBody .stats b { color: var(--txt); }
    #mBtns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

    /* ЭКСПОРТ/ИМПОРТ КОДА СОХРАНЕНИЯ */
    .codeBox {
      width: 100%; box-sizing: border-box; margin-top: 8px; padding: 8px;
      font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; line-height: 1.4;
      background: #0e140c; color: var(--green); border: 2px solid var(--line); border-radius: 8px;
      resize: vertical; word-break: break-all;
    }
    .codeStatus { margin-top: 8px; font-size: 12px; font-weight: 700; line-height: 1.5; }
    .codeStatus.ok  { color: var(--green); }
    .codeStatus.err { color: var(--red); }

    #toasts { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 60; pointer-events: none; }
    .toast {
      background: #26361f; border: 2px solid var(--green); border-radius: 8px; color: var(--txt);
      padding: 8px 14px; font-size: 12.5px; font-weight: 700; max-width: 92vw; text-align: center;
      animation: tin .22s ease-out; box-shadow: 0 3px 0 rgba(0, 0, 0, .5);
    }
    @keyframes tin { from { opacity: 0; transform: translateY(-10px); } }

    /* Табличка «Вышло обновление!»: поверх всего экрана (выше тостов, z-index 70).
       Скрыта по умолчанию; показывается добавлением класса .show. */
    #updOverlay {
      position: fixed; inset: 0; background: rgba(6, 10, 5, .85); z-index: 70;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #updOverlay.show { display: flex; }
    #updCard {
      width: 100%; max-width: 380px; background: var(--panel);
      border: 3px solid var(--gold); border-radius: 10px; padding: 18px;
      text-align: center; box-shadow: 0 0 0 3px #000, 0 0 34px rgba(255, 217, 94, .2);
      animation: tin .22s ease-out;
    }
    #updTitle { font-size: 16px; font-weight: 800; color: var(--gold); letter-spacing: 1px; margin-bottom: 8px; }
    #updText { font-size: 13.5px; line-height: 1.55; color: var(--dim); margin-bottom: 16px; }
    #updBtns { display: flex; gap: 10px; justify-content: center; }
    #updBtns .btn { flex: 1 1 0; }

    #starLine { color: var(--gold); }
    #eventBar {
      margin: 0 2px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      text-align: center; border: 2px solid var(--line); background: var(--panel);
      animation: tin .22s ease-out;
    }
    #eventBar.bad  { border-color: var(--red);  color: var(--red);  background: #3a1512; }
    #eventBar.good { border-color: var(--gold); color: var(--gold); background: #3a320f; }

    @media (max-width: 820px) {
      #app { flex-direction: column; }
      #left { flex: 0 0 auto; gap: 12px; padding: 12px 12px 16px; }
      #shop { flex: 1 1 auto; width: 100%; border-left: none; border-top: 3px solid var(--line); }
      #shopList { padding: 10px 10px 24px; }
    }
    @media (max-width: 400px) {
      .item .ic { width: 28px; font-size: 21px; }
      .item .price { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div id="app">

    <!-- ===== ЛЕВАЯ ЧАСТЬ ===== -->
    <section id="left">
      <div id="topbar">
        <div id="counter">
          <div class="num"><span class="cur">▦</span><span id="pxTop">0</span></div>
          <div class="sub"><b id="chRate">0</b>/сек · <b id="chClick">0</b>/клик</div>
          <div class="sub" id="starLine" hidden>⭐ Престиж: <b id="starCount">0</b> · доход <b id="starBonus">+0%</b></div>
        </div>
        <button id="btnSettings" title="Настройки">⚙</button>
      </div>

      <button id="gardenBtn" aria-label="Тапай по грядке">
        <canvas id="garden" width="260" height="170"></canvas>
        <div id="floats"></div>
      </button>

      <div id="gardenInfo">🌾 Пшеница · Грядок: 1</div>

      <div id="eventBar" hidden></div>

      <div id="harvestWrap">
        <div class="hbar"><span>🧺 Урожай в амбаре</span><span><b id="hvNow">0</b> / <b id="hvCap">150</b></span></div>
        <div class="track"><i id="hvFill"></i></div>
        <button id="btnSell" class="btn gold">🏪 Продать урожай — ▦ 0</button>
      </div>

      <button id="btnInstall" class="btn ghost" hidden>⬇ Установить приложение</button>
    </section>

    <!-- ===== ПРАВАЯ ЧАСТЬ: магазин ===== -->
    <aside id="shop">
      <div id="shopHead"><h2>УЛУЧШЕНИЯ</h2></div>
      <div id="shopList"></div>
    </aside>

  </div>

  <div id="modalWrap" hidden>
    <div id="modal">
      <h3 id="mTitle"></h3>
      <div id="mBody"></div>
      <div id="mBtns"></div>
    </div>
  </div>
  <div id="toasts"></div>

  <!-- Табличка «Вышло обновление!»: появляется при заходе, если вышла новая версия игры.
       Работает и в браузере, и в установленном PWA. -->
  <div id="updOverlay">
    <div id="updCard">
      <div id="updTitle">🔄 Вышло обновление!</div>
      <div id="updText">Доступна новая версия игры. Обновить сейчас?</div>
      <div id="updBtns">
        <button id="updBtn" class="btn gold">Обновить</button>
        <button id="updLater" class="btn ghost">Позже</button>
      </div>
    </div>
  </div>

<script>
/* ======================================================================
   ФЕРМА ПИКСЕЛЕЙ — браузерный кликер про ферму (один файл, Cookie Clicker)
   Экономика: клик по грядке → пиксели; улучшения дают PPS и множители;
   семена растут на грядках, урожай копится в амбаре и продаётся на рынке.

/* ======================================================================
   BIG-ЧИСЛА (защита от переполнения)
   ======================================================================
   Обычные double переполняются: при очень больших суммах операции дают
   Infinity/NaN, и доход «уходит в минус». Чтобы этого не было, деньги
   (px и total) храним как { m, e } где значение = m·10^e, а мантисса m
   лежит в [1, 10) — как в научной записи. Все операции — через функции
   ниже, они не могут ни переполниться, ни дать отрицательный результат.
   Группы суффиксов: K, M, B, T, Qa, Qi, Sx, Sp, Oc, No, Dc.
   Всё, что больше таблицы суффиксов, показывается как «∞» (лимит). */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

/* Создать big-число m·10^e. Нормализует мантиссу в [1,10).
   Отрицательные/ноль → 0 (деньги никогда не уходят в минус),
   не-числа (Infinity/NaN) → за-предельный «∞»-маркер. */
function sci(m, e) {
  m = Number(m); e = Number(e) || 0;
  if (!isFinite(m)) return { m: 1, e: 200 };       // переполнение double → «бесконечный» лимит
  if (!(m > 0)) return { m: 0, e: 0 };             // ноль или минус → 0
  const pe = Math.floor(Math.log10(m)) + e;        // порядок значения
  return { m: m / Math.pow(10, pe - e), e: pe };
}
function sciFrom(x) { return sci(x, 0); }          // обычное число → big

/* Преобразовать в число (только для DOM-ширин/процентов — безопасно упирается в предел) */
function sciToNum(a) {
  if (a.m === 0) return 0;
  if (a.e >= 130) return 1e130;                    // не даём DOM-математике уйти в Infinity
  return a.m * Math.pow(10, a.e);
}

/* Сложение: приводим к общему порядку. Разница >12 порядков пренебрежима —
   точности double (15 знаков) для неё не хватает, поэтому просто берём большее. */
function sciAdd(a, b) {
  if (a.m === 0) return b;
  if (b.m === 0) return a;
  if (a.e - b.e >= 12) return a;
  if (b.e - a.e >= 12) return b;
  const e = Math.min(a.e, b.e);
  return sci(a.m * Math.pow(10, a.e - e) + b.m * Math.pow(10, b.e - e), e);
}

/* Вычитание (только для траты, a >= b): никогда не даёт отрицательный результат */
function sciSub(a, b) {
  if (b.m === 0) return a;
  if (a.m === 0) return { m: 0, e: 0 };
  if (a.e < b.e || (a.e === b.e && a.m < b.m)) return { m: 0, e: 0 };  // не хватает → 0, без минуса
  if (a.e - b.e >= 12) return a;                   // цена пренебрежимо мала
  const e = Math.min(a.e, b.e);
  return sci(a.m * Math.pow(10, a.e - e) - b.m * Math.pow(10, b.e - e), e);
}

/* Умножение и деление */
function sciMul(a, b) { return (a.m === 0 || b.m === 0) ? { m: 0, e: 0 } : sci(a.m * b.m, a.e + b.e); }
function sciMulS(a, s) { return sciMul(a, sciFrom(s)); }
function sciDiv(a, b)  { return b.m === 0 ? { m: 1, e: 200 } : sci(a.m / b.m, a.e - b.e); }
function sciDivS(a, s) { return sciDiv(a, sciFrom(s)); }

/* Сравнение: -1/0/1 */
function sciCmp(a, b) {
  if (a.m === 0) return b.m === 0 ? 0 : -1;
  if (b.m === 0) return 1;
  if (a.e !== b.e) return a.e > b.e ? 1 : -1;
  return a.m > b.m ? 1 : a.m < b.m ? -1 : 0;
}
function sciGte(a, b) { return sciCmp(a, b) >= 0; }
function sciLt(a, b)  { return sciCmp(a, b) < 0; }
function sciEq(a, b)  { return sciCmp(a, b) === 0; }

/* Квадратный корень (для престижа) */
function sciSqrt(a) { return a.m === 0 ? { m: 0, e: 0 } : sci(Math.sqrt(a.m), a.e / 2); }
/* Целая часть (вниз) */
function sciFloor(a) { return a.e < 0 ? { m: 0, e: 0 } : sci(Math.floor(a.m), a.e); }

/* Текст: от 0 до 999 показываем числом, дальше — суффикс, за таблицей — ∞ */
function sciStr(a) {
  if (a.e < 3) { const v = a.m * Math.pow(10, a.e); return '' + Math.max(0, Math.floor(v)); }
  let g = Math.floor(a.e / 3);
  if (g >= SUF.length) return '∞';                 // превышен лимит суффиксов
  let mu = a.m * Math.pow(10, a.e - g * 3);        // мантисса в [1, 1000) для удобства чтения
  if (mu >= 999.95) { mu /= 1000; g++; if (g >= SUF.length) return '∞'; }
  const s = mu >= 100 ? mu.toFixed(0) : mu >= 10 ? mu.toFixed(1) : mu.toFixed(2);
  return s + SUF[g];
}

/* Универсальный формат: принимает и обычное число, и big-число {m,e}.
   Никогда не возвращает NaN/Infinity/минус. */
function fmt(x) {
  if (typeof x === 'bigint') return fmtStars(x);
  if (x && typeof x === 'object' && isFinite(x.m)) return sciStr(x);
  const n = Number(x);
  if (!isFinite(n)) return '∞';
  return sciStr(sci(n < 0 ? 0 : n, 0));
}

  { id: 'market',   n: 'Рынок',             ic: '🏪', sec: 'УРОЖАЙ',   desc: '+12% к цене',              base: 1200,  g: 2.15, kind: 'priceMul',  val: 0.12 },

  { id: 'export',   n: 'Экспорт',           ic: '🚢', sec: 'УРОЖАЙ',   desc: '+25% к цене продажи',      base: 3e8,    g: 2.50, kind: 'priceMul',  val: 0.25 },

  { id: 'portal',   n: 'Портал',            ic: '🌀', sec: 'ОСОБЫЕ',   desc: '+25% ко всему доходу',     base: 1e10,   g: 3.00, kind: 'allMul',    val: 0.25 },
  { id: 'timemachine',n:'Машина времени',   ic: '⏳', sec: 'ОСОБЫЕ',   desc: '+35% ко всему доходу',     base: 1e12,   g: 3.00, kind: 'allMul',    val: 0.35 },
  { id: 'blackhole',n: 'Чёрная дыра',       ic: '🕳️', sec: 'ОСОБЫЕ',   desc: '+50% ко всему доходу',     base: 1e14,   g: 3.10, kind: 'allMul',    val: 0.5 },
  { id: 'mars',     n: 'Ферма на Марсе',    ic: '🚀', sec: 'ОСОБЫЕ',   desc: '+80% ко всему доходу',     base: 1e16,   g: 3.20, kind: 'allMul',    val: 0.8 },
];

/* Порядок категорий в магазине */
const SEC_ORDER = ['ГРЯДКИ', 'СЕМЕНА', 'КЛИК', 'АВТОКЛИК', 'РОСТ', 'УРОЖАЙ', 'ОСОБЫЕ'];

/* ===== Состояние ===== */
function defState() {
  const up = {};
  UPG.forEach(u => up[u.id] = 0);
  return {
    px: { m: 0, e: 0 }, total: { m: 0, e: 0 }, clicks: 0,   // px/total — big-числа {m,e}
    harvest: 0,          // урожай в амбаре (единицы)
    beds: 1,             // число грядок
    seed: 'wheat',       // активное (последнее купленное) семя
    seeds: { wheat: true },
    up,
    prog: [0],           // прогресс роста по каждой грядке
    stars: 0n,           // ⭐ престиж — BigInt: целые числа не переполняются и не уходят в минус
    started: false,
  };
}
let S = defState();

/* ===== РЕДКИЕ СОБЫТИЯ =====
   Иногда на ферму обрушиваются неприятности (доход падает) или радости (доход растёт).
   Событие действует ограниченное время и показывает баннер под игровым полем. */
let ev = null;                                    // текущее событие { n, ic, mul, bad, dur, t } или null
let nextEventIn = 50 + Math.random() * 50;        // секунд до следующего события
const EVENTS = [
  { n: 'Засуха',    ic: '🌞', mul: 0.5,  bad: true,  dur: [15, 25] },
  { n: 'Вредители', ic: '🐛', mul: 0.6,  bad: true,  dur: [12, 20] },
  { n: 'Град',      ic: '🌨️', mul: 0.55, bad: true,  dur: [10, 18] },
  { n: 'Саранча',   ic: '🦗', mul: 0.45, bad: true,  dur: [8, 16] },
  { n: 'Ярмарка',   ic: '🎉', mul: 2.0,  bad: false, dur: [12, 18] },
  { n: 'Дожди',     ic: '🌧️', mul: 1.8,  bad: false, dur: [15, 25] },
];
function updateEvents(dt) {
  if (ev) {                                       // событие активно — тикаем таймер
    ev.t -= dt;
    if (ev.t <= 0) { toast('Событие «' + ev.n + '» закончилось'); ev = null; }
    return;
  }
  if (sciLt(S.total, sciFrom(500))) return;          // в самом начале игрока не трогаем
  nextEventIn -= dt;
  if (nextEventIn > 0) return;
  const e = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  const dur = e.dur[0] + Math.random() * (e.dur[1] - e.dur[0]);
  ev = { n: e.n, ic: e.ic, mul: e.mul, bad: e.bad, dur, t: dur };
  nextEventIn = 50 + Math.random() * 70;
  toast((e.bad ? '⚠️ ' : '🎊 ') + e.n + ': доход ×' + e.mul + ' на ' + Math.round(dur) + 'с');
}

/* Флаг сброса: пока true — автосейв молчит, чтобы не вернуть только что стёртые данные */
let resetting = false;
/* Копия состояния для JSON: BigInt (престиж) превращаем в строку — JSON.stringify не умеет BigInt */
function plainState() {
  const d = { stars: starsBig(S.stars).toString() };
  for (const k in S) if (k !== 'stars') d[k] = S[k];
  return d;
}
function save() {
  if (resetting) return;                                   // во время сброса не сохраняем ничего
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(plainState())); } catch (e) {}
}
/* Санитизация состояния: превращает любой объект в корректное сохранение.
   Используется и при загрузке из localStorage, и при импорте кода. */
function sanitizeState(o) {
  if (!o || typeof o !== 'object') return null;
  const s = defState();
  // числа: при ошибке или бесконечности берём значение по умолчанию
  const num = (v, lo, hi, def) => { v = Number(v); return (isFinite(v)) ? clamp(v, lo, hi) : def; };
  // big-числа {m,e}: принимаем и объект мантисса/порядок, и число (старые сохранения/коды)
  const sciDef = (v) => {
    if (v && typeof v === 'object' && isFinite(v.m)) return sci(v.m, v.e);
    const n = Number(v);
    return isFinite(n) ? sci(Math.max(n, 0), 0) : { m: 0, e: 0 };
  };
  s.px      = sciDef(o.px);
  s.total   = sciDef(o.total);
  s.clicks  = num(o.clicks, 0, Infinity, 0) | 0;
  s.harvest = num(o.harvest, 0, Infinity, 0);
  s.beds    = Math.round(num(o.beds, 1, MAX_BEDS, 1));
  s.stars   = starsBig(o.stars);                      // ⭐ — BigInt; отрицательный престиж сбрасывается к 0
  s.started = !!o.started;
  // купленные семена: только реально существующие в игре
  if (o.seeds && typeof o.seeds === 'object') {
    for (const k of Object.keys(o.seeds)) if (o.seeds[k] && SEEDS.some(x => x.id === k)) s.seeds[k] = true;
  }
  s.seeds.wheat = true;                              // пшеница есть всегда
  // уровни улучшений: только известные id, неотрицательные целые
  if (o.up && typeof o.up === 'object') {
    for (const u of UPG) { const v = num(o.up[u.id], 0, 1e9, 0); s.up[u.id] = Math.floor(v); }
  }
  // активное семя: должно быть куплено
  const chosen = typeof o.seed === 'string' ? o.seed : 'wheat';
  s.seed = s.seeds[chosen] ? chosen : 'wheat';
  // прогресс роста по грядкам: не длиннее числа грядок, значения 0..1
  s.prog = Array.isArray(o.prog)
    ? o.prog.slice(0, s.beds).map(v => clamp(Number(v) || 0, 0, 1))
    : [];
  while (s.prog.length < s.beds) s.prog.push(0);
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = sanitizeState(JSON.parse(raw));
    if (!s) return false;
    S = s;
    return true;
  } catch (e) { return false; }
}

/* ===== Формулы экономики ===== */
function seedDef() { return SEEDS.find(s => s.id === S.seed) || SEEDS[0]; }
function lvl(id) { return S.up[id] || 0; }
function clickFlat() { return 1 + lvl('shovel') * 2 + lvl('combine') * 10; }
function clickMul() { return 1 + lvl('glove') * 0.08 + lvl('drone') * 0.12 + lvl('exo') * 0.2; }
function autoFlat() { return lvl('watering') * 2 + lvl('worker') * 15 + lvl('robots') * 120; }
function autoMul() { return (1 + lvl('tractor') * 0.10 + lvl('solar') * 0.15 + lvl('ai') * 0.35); }
function growMul() { return (1 + lvl('fertilizer') * 0.15 + lvl('bees') * 0.18 + lvl('greenhouse') * 0.22 + lvl('hydro') * 0.3 + lvl('genetics') * 0.45 + lvl('magic') * 0.7); }
function yieldMul() { return (1 + lvl('collector') * 0.12 + lvl('orangery') * 0.22 + lvl('logistics') * 0.3); }
function allMul() { return (1 + lvl('portal') * 0.25 + lvl('timemachine') * 0.35 + lvl('blackhole') * 0.5 + lvl('mars') * 0.8); }
function barnCap() { return sciMulS(sciFrom(150), Math.pow(2, lvl('barn'))); }   // амбар: ×2 к лимиту за уровень (big)
function price() { return 1 + lvl('market') * 0.12 + lvl('export') * 0.25; }
/* Престиж: каждая ⭐ даёт +5% ко всему доходу (складывается с прочими множителями).
   Звёзды храним как BigInt — они не ограничены 2^53, не переполняются и не могут уйти в минус.
   Показываем их суффиксами: 0, 12, 1.5K, 3.2M, 7.8B, 1.9T, Qa, Qi, … */
function starsBig(v) {
  // любое значение (число, строка, BigInt) → неотрицательный BigInt; минус сбрасываем к 0
  if (typeof v === 'bigint') return v >= 0n ? v : 0n;
  if (v === null || v === undefined || v === '') return 0n;
  try {
    const b = BigInt(String(v));
    return b >= 0n ? b : 0n;                     // отрицательный престиж → 0
  } catch (e) { return 0n; }
}
function starsNum() {
  // число звёзд для формул бонуса дохода: BigInt → number (огромные значения упираются в предел, минуса нет)
  const n = Number(starsBig(S.stars));
  return isFinite(n) ? n : 1e100;
}
function sciFromBigInt(b) {
  // BigInt → big-число {m,e} (для суффиксов и сравнений)
  if (typeof b !== 'bigint') b = starsBig(b);
  if (b <= 0n) return { m: 0, e: 0 };
  const s = b.toString();
  const m = Number(s.slice(0, 13)) / Math.pow(10, Math.min(12, s.length - 1));
  return { m, e: s.length - 1 };
}
function fmtStars(b) {
  // отображение престижа: 0, 12, 1.5K, 3.2M, 7.8B, 1.9T, Qa…
  if (typeof b !== 'bigint') b = starsBig(b);
  if (b <= 0n) return '0';
  return sciStr(sciFromBigInt(b));
}
function sciToBigInt(a) {
  // big-число {m,e} → BigInt (целая часть) — считаем корень без float-ошибок
  if (!a || a.m === 0) return 0n;
  if (a.e < 0) return 0n;
  const e = Math.floor(a.e);
  if (e < 16) return BigInt(Math.floor(a.m * Math.pow(10, e)));
  const mant = Math.floor(a.m * 1e15);              // 16 значащих цифр мантиссы
  return BigInt(mant) * 10n ** BigInt(e - 15);
}
function bigIntSqrt(n) {
  // целочисленный корень BigInt (округление вниз): floor(sqrt(n))
  if (n < 0n) return 0n;
  if (n < 2n) return n;
  let x = 1n << BigInt((n.toString(2).length + 1) >> 1);   // стартовое приближение
  for (;;) {
    const y = (x + n / x) >> 1n;
    if (y >= x) break;
    x = y;
  }
  while (x * x > n) x -= 1n;         // Ньютон может дать на единицу больше — это точный floor-корень
  return x;
}
function prestigeGain() { return bigIntSqrt(sciToBigInt(sciDivS(S.total, 1e4))); }   // сколько ⭐ дадут — BigInt
function prestigeMul() { return 1 + starsNum() * 0.05; }    // бонус не может быть минусом: звёзды всегда ≥ 0
/* Редкие события: временно меняют доход (засуха, вредители — снижают, ярмарка — повышает) */
function eventMul() { return ev ? ev.mul : 1; }
function perClick() { return clickFlat() * clickMul() * allMul() * prestigeMul() * eventMul(); }
function perSec() { return autoFlat() * autoMul() * allMul() * prestigeMul() * eventMul(); }
function upCost(u) {
  /* Обычная цена: базовая × рост(g) в степени уровня (для амбара g = 1.45 — рост мягкий) */
  const honest = sciMulS(sciFrom(u.base), Math.pow(u.g, lvl(u.id)));
  /* Правило окупаемости амбара: если честная цена дороже дохода за 10 минут (600 с),
     снижаем её до этого предела. Значит амбар всегда окупится максимум за 10 минут. */
  if (u.kind === 'barnCap' && perSec() > 0) {
    const budget = sciMulS(sciFrom(perSec()), 600);
    if (sciLt(budget, honest)) return budget;
  }
  return honest;
}
/* Цена «бесконечной» грядки растёт по числу грядок сверх пятой */
function infBedCost() { return sciMulS(sciFrom(360000), Math.pow(3.2, S.beds - 5)); }

/* ===== Тост ===== */
let lastFullToast = 0;
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* ===== Модалка ===== */
function modal(title, html, buttons) {
  $('mTitle').textContent = title;
  $('mBody').innerHTML = html;
  const box = $('mBtns');
  box.innerHTML = '';
  (buttons || [{ label: 'OK' }]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || 'pri');
    el.textContent = b.label;
    el.onclick = () => { closeModal(); if (b.fn) b.fn(); };
    box.appendChild(el);
  });
  $('modalWrap').hidden = false;
}
function closeModal() { $('modalWrap').hidden = true; }

/* ======================================================================
   ДЕЙСТВИЯ
   ====================================================================== */
function tap(e) {
  const gain = perClick();
  S.px = sciAdd(S.px, sciFrom(gain)); S.total = sciAdd(S.total, sciFrom(gain)); S.clicks++;
  const r = cv.getBoundingClientRect();
  const sx = clamp(e.clientX - r.left, 2, r.width - 2);
  const sy = clamp(e.clientY - r.top, 2, r.height - 2);
  burst(sx / r.width * W, sy / r.height * H, 7);
  floatText(sx, sy, '+' + fmt(gain));
  renderHud(); updateAfford();
}

/* Покупка многоразового улучшения */
function buyUp(id) {
  const u = UPG.find(x => x.id === id);
  const cost = upCost(u);
  if (sciLt(S.px, cost)) { toast('Нужно ▦ ' + fmt(cost)); return; }
  S.px = sciSub(S.px, cost);
  S.up[id]++;
  toast('🛠 ' + u.n + ' ур. ' + S.up[id]);
  renderShop(true); renderHud();
}

/* Покупка семени (одноразово): после покупки исчезает из списка, становится активным */
function buySeed(id) {
  const s = SEEDS.find(x => x.id === id);
  if (S.seeds[id]) return;                       // уже куплено — не должно случаться
  if (sciLt(S.px, sciFrom(s.cost))) { toast('Нужно ▦ ' + fmt(s.cost)); return; }
  S.px = sciSub(S.px, sciFrom(s.cost));
  S.seeds[id] = true;
  S.seed = id;                                    // засеваем новинку
  toast('🌱 Засеяно: ' + s.n + '!');
  bigBurst();
  renderShop(true); renderHud();
}

/* Покупка одноразовой грядки (2..5), строго по порядку */
function buyBedTo(n) {
  const b = BEDS.find(x => x.beds === n);
  if (S.beds >= n) return;
  if (S.beds !== n - 1) { toast('Сначала купи предыдущую грядку'); return; }
  if (sciLt(S.px, sciFrom(b.cost))) { toast('Нужно ▦ ' + fmt(b.cost)); return; }
  S.px = sciSub(S.px, sciFrom(b.cost));
  S.beds = n;
  S.prog.push(0);
  toast('🌱 Грядок стало: ' + n);
  bigBurst();
  renderShop(true); renderHud();
}

/* Покупка «бесконечной» грядки (появляется после пятой) */
function buyBedInf() {
  if (S.beds >= MAX_BEDS) { toast('Достигнут предел грядок (' + MAX_BEDS + ')'); return; }
  const cost = infBedCost();
  if (sciLt(S.px, cost)) { toast('Нужно ▦ ' + fmt(cost)); return; }
  S.px = sciSub(S.px, cost);
  S.beds++;
  S.prog.push(0);
  toast('🌱 Бесконечная грядка: ' + S.beds + ' шт.');
  bigBurst();
  renderShop(true); renderHud();
}

/* Продажа урожая */
function sellHarvest() {
  if (S.harvest <= 0) { toast('Амбар пуст'); return; }
  const gain = sciMulS(sciFrom(S.harvest), price());   // выручка как big-число
  S.px = sciAdd(S.px, gain); S.total = sciAdd(S.total, gain); S.harvest = 0;
  toast('🏪 Продано на ▦ ' + fmt(gain));
  renderHud(); updateAfford();
}

/* ===== Сброс прогресса =====
   Полностью стирает сохранение и возвращает игру к началу. */
function resetGame() {
  // 4) Спрашиваем подтверждение перед сбросом
  if (!confirm('Точно сбросить прогресс?')) return;

  resetting = true;                                        // 1) глушим автосейв (иначе beforeunload вернёт прогресс)

  // 2) Полностью очищаем localStorage и ключ сохранения
  try { localStorage.clear(); } catch (e) {}
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}

  // 3) Сбрасываем данные, хранящиеся в переменных, к начальным значениям
  S = defState();
  shopStructKey = '';                                      // сброс магазина — перерисуется заново
  shopRefs = [];

  // 5) Перезагружаем страницу: улучшения, семена, пиксели и грядки — как в начале
  location.reload();
}

/* ===== ПРЕСТИЖ =====
   Сброс прогресса в обмен на ⭐. Каждая ⭐ навсегда даёт +5% ко всему доходу,
   поэтому рано или поздно выгодно начать ферму заново — уже сильнее. */
function doPrestige() {
  const gain = prestigeGain();                      // сколько ⭐ дадут сейчас (BigInt)
  if (gain < 1n) { toast('Мало заработано — нужно ▦ ' + fmt(1e6) + ' всего за игру'); return; }
  if (!confirm('Престиж: сбросить ферму и получить ' + fmtStars(gain) + ' ⭐?')) return;

  const stars = starsBig(S.stars) + gain;           // ⭐ (BigInt) накапливаются между престижами
  S = defState();
  S.stars = stars;
  S.started = true;
  shopStructKey = ''; shopRefs = [];
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(plainState())); } catch (e) {}
  location.reload();
}

/* ===== КОД СОХРАНЕНИЯ =====
   Экспорт: состояние → компактный JSON → сжатие lz-string → base64-код в текстовое поле.
   Импорт: код → распаковка → проверка данных (sanitizeState) → перезагрузка страницы.
   Оба действия находятся в настройках (⚙). */
function buildSaveJSON() {
  const r2 = v => Math.round(v * 100) / 100;      // округляем числа — код выходит короче
  return JSON.stringify({
    px: { m: Math.round(S.px.m * 10000) / 10000, e: S.px.e },   // большие числа храним как {мантисса, порядок}
    total: { m: Math.round(S.total.m * 10000) / 10000, e: S.total.e },
    clicks: S.clicks | 0,
    harvest: r2(S.harvest), beds: S.beds, seed: S.seed,
    seeds: S.seeds, up: S.up,
    prog: S.prog.map(r2),
    stars: starsBig(S.stars).toString(), started: !!S.started,   // престиж — BigInt строкой в JSON
  });
}

function setCodeStatus(msg, cls) {
  const st = $('codeStatus');
  st.textContent = msg;
  st.className = 'codeStatus ' + cls;
  st.hidden = false;
}

/* Пункт 1: собрать всё состояние, сжать и показать код в текстовом поле */
function exportCode() {
  try {
    const code = LZString.compressToBase64(buildSaveJSON());
    $('codeOut').value = code;
    setCodeStatus('✅ Код создан: ' + code.length + ' симв. Скопируй его и сохрани. Он заменит прогресс при загрузке.', 'ok');
  } catch (e) { setCodeStatus('⚠️ Не удалось создать код', 'err'); }
}

/* Бонус: быстрое копирование кода в буфер обмена */

}

/* Пункт 2: принять код, распаковать, проверить и загрузить прогресс */
function importCode() {
  const code = $('codeIn').value.trim();
  if (!code) { setCodeStatus('Вставь код в поле выше', 'err'); return; }
  let json = null;
  try { json = LZString.decompressFromBase64(code); } catch (e) {}
  if (json === null) {                       // запасной вариант: чистый JSON или URL-код
    try { json = code.charAt(0) === '{' ? code : LZString.decompressFromEncodedURIComponent(code); } catch (e) {}
  }
  if (!json) { setCodeStatus('⚠️ Ошибка: код не распознан — проверь, что ты скопировал его целиком', 'err'); return; }
  try {
    const s = sanitizeState(JSON.parse(json));
    if (!s) { setCodeStatus('⚠️ Ошибка: в коде нет данных сохранения', 'err'); return; }
    S = s;
    shopStructKey = ''; shopRefs = [];       // магазин перерисуется при загрузке
    save();                                  // пишем в localStorage перед перезагрузкой
    toast('✅ Сохранение загружено, перезагружаюсь…');
    setTimeout(() => location.reload(), 700);
  } catch (e) { setCodeStatus('⚠️ Ошибка: код неверный или повреждён', 'err'); }
}

/* Позиции категории */
function itemsFor(cat) {
  if (cat === 'ГРЯДКИ') {
    const arr = [];
    BEDS.forEach(b => { if (S.beds === b.beds - 1) arr.push(bedCard(b)); });   // следующая одноразовая
    if (S.beds >= 5) arr.push(infBedCard());                                    // бесконечная
    return arr;
  }
  if (cat === 'СЕМЕНА') {
    return SEEDS.filter(s => !S.seeds[s.id]).map(seedCard);                     // только некупленные
  }
  return UPG.filter(u => u.sec === cat).map(upgCard);                           // многоразовые — всегда
}

function renderShop(force) {
  const key = structKey();
  if (!force && key === shopStructKey) return;
  shopStructKey = key;
  shopRefs = [];
  const box = $('shopList');
  box.innerHTML = '';
  SEC_ORDER.forEach(cat => {
    const items = itemsFor(cat);
    if (!items.length) return;              // пустую категорию не показываем
    box.appendChild(secEl(cat));
    items.forEach(el => box.appendChild(el));
  });
  updateAfford();
}

/* ======================================================================
   СИМУЛЯЦИЯ ГРЯДОК
   ====================================================================== */
function updateGarden(dt) {
  const rate = growMul() / seedDef().time;
  const yMul = yieldMul() * allMul() * prestigeMul() * eventMul();
  const cap = barnCap();
  const yld = seedDef().yield;
  const capNum = sciToNum(cap);                 // число-потолок амбара (упирается в безопасный предел)
  let full = false;
  for (let i = 0; i < S.beds; i++) {
    let p = (S.prog[i] || 0) + rate * dt;
    while (p >= 1) {
      p -= 1;
      const add = yld * yMul;
      if (S.harvest + add <= capNum) S.harvest += add;
      else { S.harvest = Math.min(capNum, S.harvest + add); full = true; }
    }
    S.prog[i] = p;
  }
  if (full) {
    const now = performance.now();
    if (now - lastFullToast > 4000) { lastFullToast = now; toast('📦 Амбар полон — продай урожай или купи Амбар'); }
  }
  }

/* ======================================================================
   CANVAS: детализированная пиксельная сцена
   ====================================================================== */
const cv = $('garden');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;      // 260 x 170
const GROUND = 120;
ctx.imageSmoothingEnabled = false;

const CLOUDS = [{ x: 30, y: 26, s: 1.0 }, { x: 150, y: 16, s: 0.8 }, { x: 220, y: 38, s: 1.2 }];

const parts = [];
function burst(x, y, n) {
  const col = seedDef().head;
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, vx: (Math.random() - 0.5) * 34, vy: -20 - Math.random() * 26, life: 0.6 + Math.random() * 0.4, age: 0, c: Math.random() < 0.25 ? '#ffffff' : col });
  }
}
function bigBurst() {
  for (let i = 0; i < 46; i++) {
    parts.push({ x: W / 2, y: GROUND - 14, vx: (Math.random() - 0.5) * 130, vy: -40 - Math.random() * 70, life: 0.9 + Math.random() * 0.6, age: 0, c: Math.random() < 0.3 ? '#ffffff' : '#ffd95e' });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.age += dt;
    if (p.age >= p.life) { parts.splice(i, 1); continue; }
    p.vy += 120 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts() {
  parts.forEach(p => {
    const s = p.age < p.life * 0.6 ? 2 : 1;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x | 0, p.y | 0, s, s);
  });
}
function floatText(x, y, text) {
  const d = document.createElement('div');
  d.className = 'float';
  d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px';
  $('floats').appendChild(d);
  setTimeout(() => d.remove(), 800);
}

function drawSky(t) {
  const bands = ['#26324e', '#33456a', '#405a82', '#4d6f9a'];
  const bh = Math.ceil(GROUND / bands.length);
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * bh, W, bh); });
  ctx.fillStyle = '#ffe07a';
  ctx.fillRect(W - 44, 16, 16, 16);
  ctx.fillRect(W - 48, 20, 24, 8);
  ctx.fillRect(W - 40, 12, 8, 24);
  ctx.fillStyle = '#fff4c0';
  ctx.fillRect(W - 40, 20, 8, 8);
  CLOUDS.forEach(cd => {
    const x = ((cd.x + t * 6 * cd.s) % (W + 60)) - 30;
    const y = cd.y, s = cd.s;
    ctx.fillStyle = '#cdd9ec';
    ctx.fillRect(x, y, 26 * s, 8 * s);
    ctx.fillRect(x + 4 * s, y - 5 * s, 18 * s, 6 * s);
    ctx.fillRect(x + 8 * s, y + 6 * s, 14 * s, 4 * s);
  });
}
function drawHills() {
  ctx.fillStyle = '#2c4a2a';
  for (let x = 0; x < W; x += 40) {
    ctx.fillRect(x, GROUND - 22, 40, 22);
    ctx.fillRect(x + 8, GROUND - 30, 24, 8);
  }
  ctx.fillStyle = '#356033';
  for (let x = 20; x < W; x += 60) ctx.fillRect(x, GROUND - 16, 30, 16);
}
function drawBarn() {
  const bx = 12, by = GROUND - 62, bw = 46, bh = 40;
  ctx.fillStyle = '#8a3324'; ctx.fillRect(bx, by + 12, bw, bh);
  ctx.fillStyle = '#c0412d'; ctx.fillRect(bx + 3, by + 15, bw - 6, bh - 6);
  ctx.fillStyle = '#e0d7c0';
  ctx.fillRect(bx + (bw / 2) - 6, by + 28, 12, bh - 16);
  ctx.fillRect(bx + (bw / 2) - 1, by + 28, 2, bh - 16);
  ctx.fillStyle = '#7a2a1c'; ctx.fillRect(bx, by + 8, bw, 6);
  ctx.fillStyle = '#b03a28';
  ctx.fillRect(bx + 3, by + 2, bw - 6, 6);
  ctx.fillRect(bx + 10, by - 2, bw - 20, 6);
  ctx.fillStyle = '#f0e6cc'; ctx.fillRect(bx + (bw / 2) - 1, by - 6, 2, 6);
}
function drawFence() {
  ctx.fillStyle = '#7a5a34';
  ctx.fillRect(0, GROUND - 14, W, 2);
  ctx.fillRect(0, GROUND - 8, W, 2);
  for (let x = 6; x < W; x += 26) ctx.fillRect(x, GROUND - 18, 3, 12);
}
function drawGround() {
  ctx.fillStyle = '#3a2a12'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#6b431f'; ctx.fillRect(0, GROUND, W, 7);
  let seed = 99 + S.beds;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 90; i++) {
    const x = (rnd() * W) | 0, y = GROUND + 5 + ((rnd() * (H - GROUND - 6)) | 0);
    ctx.fillStyle = rnd() < 0.5 ? '#552f13' : '#7d5228';
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.fillStyle = '#4a3016';
  for (let y = GROUND + 10; y < H; y += 9) ctx.fillRect(0, y, W, 1);
}

/* Растение: все части привязаны к низу (gy) и растут вверх синхронно */
function drawCrop(x, gy, prog, pal, t) {
  const ripe = prog > 0.9;
  const sx = Math.round(x + Math.sin(t * 1.7 + x * 0.25) * 1.6);
  let sparkTop = gy - 24;
  switch (pal.shape) {
    case 'stalk': {
      const h = 12 + prog * 44; const top = gy - h; sparkTop = top - 8;
      ctx.fillStyle = pal.stem; ctx.fillRect(sx - 1, top, 2, h);
      ctx.fillStyle = pal.glow && ripe ? '#fff3b0' : pal.head;
      const gh = 3 + prog * 8;
      ctx.fillRect(sx - 1, top - gh + 1, 3, gh);
      ctx.fillRect(sx - 4, top + 4, 2, 2); ctx.fillRect(sx + 2, top + 6, 2, 2);
      ctx.fillStyle = pal.stem;
      ctx.fillRect(sx - 5, gy - 10, 4, 2); ctx.fillRect(sx + 2, gy - 16, 4, 2);
      break;
    }
    case 'leafy': {
      const rootH = 3 + prog * 5;
      let leafH = 4 + prog * 9;
      const leafY = gy - rootH;
      if (leafY - leafH < 6) leafH = Math.max(2, leafY - 6);
      const leafTop = leafY - leafH; sparkTop = leafTop - 4;
      ctx.fillStyle = pal.stem;
      ctx.fillRect(sx - 4, leafTop, 3, leafH);
      ctx.fillRect(sx + 1, leafTop, 3, leafH);
      ctx.fillRect(sx - 1, leafTop - 3, 2, 5);
      ctx.fillRect(sx - 6, leafTop + 2, 3, 3);
      ctx.fillRect(sx + 4, leafTop + 2, 3, 3);
      ctx.fillStyle = pal.head;
      const rw = 4 + prog * 3;
      ctx.fillRect(sx - rw / 2, leafY, rw, rootH);
      ctx.fillStyle = '#c96a20';
      ctx.fillRect(sx - 1, gy - 1, 2, 2);
      break;
    }
    case 'bush': {
      const bw = 8 + prog * 12, bh = 8 + prog * 18; const top = gy - bh; sparkTop = top - 4;
      ctx.fillStyle = pal.stem; ctx.fillRect(sx - bw / 2, top, bw, bh);
      if (ripe) { ctx.fillStyle = pal.head; ctx.fillRect(sx - bw / 2 + 2, top + 3, 3, 3); ctx.fillRect(sx + 1, top + 8, 3, 3); }
      break;
    }
    case 'vine': {
      const h = 14 + prog * 34; const top = gy - h; sparkTop = top - 4;
      ctx.fillStyle = pal.stem;
      ctx.fillRect(sx - 1, top, 2, h);
      ctx.fillRect(sx - 5, top + 6, 4, 3); ctx.fillRect(sx + 2, top + 12, 4, 3);
      ctx.fillStyle = pal.head;
      const r = 2 + prog * 2;
      for (let row = 0; row < 3; row++)
        for (let col = 0; col <= row; col++)
          ctx.fillRect(sx - row * r + col * r * 2 - r, top + (2 - row) * r, r * 2, r * 2);
      break;
    }
    case 'sun': {
      const h = 16 + prog * 40; const top = gy - h; sparkTop = top - 8;
      ctx.fillStyle = pal.stem;
      ctx.fillRect(sx - 1, top, 2, h);
      ctx.fillRect(sx - 5, gy - 12, 4, 2); ctx.fillRect(sx + 2, gy - 18, 4, 2);
      const r = 3 + prog * 6;
      ctx.fillStyle = pal.head; ctx.fillRect(sx - r, top - r, r * 2, r * 2);
      ctx.fillStyle = '#7a5a12'; ctx.fillRect(sx - 2, top - 2, 4, 4);
      break;
    }
    case 'tree': {
      // фруктовое дерево: ствол растёт, крона наливается, плоды появляются при созревании
      const th = 8 + prog * 20;                     // высота ствола
      const cw = 12 + prog * 16;                    // ширина кроны
      const cy0 = gy - th - cw * 0.5;               // центр кроны
      sparkTop = cy0 - cw * 0.5 - 4;
      ctx.fillStyle = '#6b4a2a'; ctx.fillRect(sx - 2, gy - th, 4, th);        // ствол
      ctx.fillStyle = pal.stem;                                              // крона
      ctx.fillRect(sx - cw / 2, cy0 - cw * 0.3, cw, cw * 0.65);
      ctx.fillRect(sx - cw / 2 + 3, cy0 - cw * 0.55, cw - 6, cw * 0.4);
      ctx.fillStyle = pal.glow && ripe ? '#fff3b0' : pal.head;               // плоды
      if (prog > 0.5) {
        ctx.fillRect(sx - cw / 3, cy0 - cw * 0.1, 3, 3);
        ctx.fillRect(sx + cw / 5, cy0 + cw * 0.05, 3, 3);
        if (ripe) ctx.fillRect(sx - 1, cy0 - cw * 0.35, 3, 3);
      }
      break;
    }
    default: {
      const r = 3 + prog * 8; const top = gy - r * 1.5; sparkTop = top - 4;
      ctx.fillStyle = pal.stem; ctx.fillRect(sx - 1, top, 2, r * 1.5);
      ctx.fillStyle = pal.head; ctx.fillRect(sx - r, top, r * 2, r * 1.5);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(sx - r / 3, top, 1, r * 1.5);
      ctx.fillRect(sx + r / 3, top, 1, r * 1.5);
      break;
    }
  }
  if (ripe) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx - 2, Math.max(2, sparkTop), 1, 1);
    ctx.fillRect(sx + 3, Math.max(2, sparkTop + 1), 1, 1);
  }
}

function drawScene(t) {
  drawSky(t); drawHills(); drawBarn(); drawFence(); drawGround();
  const pal = seedDef();
  const n = S.beds;
  for (let i = 0; i < n; i++) {
    const x = n === 1 ? W / 2 : 22 + i * ((W - 44) / (n - 1));
    drawCrop(x, GROUND, S.prog[i] || 0, pal, t + i * 0.4);
  }
  drawParts();
}

/* ======================================================================
   ГЛАВНЫЙ ЦИКЛ
   ====================================================================== */
let lastT = performance.now(), hudAcc = 0, saveAcc = 0;
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.5) dt = 0.5;

  if (typeof S.stars === 'bigint' && S.stars < 0n) S.stars = 0n;   // ⭐ не бывают отрицательными — сброс к 0

  if (perSec() > 0) {
    const gain = sciMulS(sciFrom(perSec()), dt);        // доход за кадр как big-число
    S.px = sciAdd(S.px, gain); S.total = sciAdd(S.total, gain);
  }
  updateGarden(dt);
  updateEvents(dt);
  updateParts(dt);
  drawScene(now / 1000);

  hudAcc += dt;
  if (hudAcc > 0.1) { hudAcc = 0; renderHud(); updateAfford(); }

  saveAcc += dt;
  if (saveAcc > 5) { saveAcc = 0; save(); }

  requestAnimationFrame(loop);
}

/* ===== Табличка «Вышло обновление!» =====
   Логика: версия игры = имя кэша в sw.js + поле version в manifest.json.
   Случаи, когда показываем табличку при заходе:
   1) service worker нашёл новую версию и заменил старую (события controllerchange
      или сообщение UPDATE_READY от нового вора) — значит вышло обновление.
   2) во время прошлого захода игрок нажал «Позже» — флаг fc_ver_pending сохранён,
      табличка покажется снова, пока игрок не обновит.
   3) версия в manifest.json не совпадает с той, что игрок видел раньше (запасной
      способ проверки — для браузеров, где события воркера не сработали). */

const PENDKEY = 'fc_ver_pending';   // «есть новая версия, игрок её отложил»
const SEENKEY = 'fc_ver_seen';      // версия, которую игрок уже видел/получил
let updateCardShown = false;        // не показываем дважды в одной сессии

// Показать табличку. «Позже» скрывает её, но флаг pending остаётся —
// при следующем заходе табличка снова появится (см. проверку ниже).
function showUpdateCard() {
  if (updateCardShown) return;
  updateCardShown = true;
  $('updOverlay').classList.add('show');
}

// Новая версия обнаружена (через service worker или manifest.json)
function onNewVersion() {
  localStorage.setItem(PENDKEY, '1');
  showUpdateCard();
}

$('updBtn').onclick = () => {
  localStorage.removeItem(PENDKEY);      // игрок решил обновиться
  localStorage.removeItem(SEENKEY);      // версию запомним заново после перезагрузки
  // Шаг 1: вычищаем весь кэш service worker — после перезапуска всё загрузится заново
  // Шаг 2: перезагружаем страницу
  caches.keys()
    .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
    .then(() => location.reload())
    .catch(() => location.reload());
};

$('updLater').onclick = () => {
  $('updOverlay').classList.remove('show');   // флаг pending намеренно НЕ трогаем
};

// При заходе: если игрок в прошлый раз отложил обновление — показываем табличку сразу
if (localStorage.getItem(PENDKEY) === '1') showUpdateCard();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    // Была ли страница под управлением старого воркера до загрузки?
    // Если нет — это либо первая установка, либо воркер ещё не успел;
    // в этих случаях табличку при первом заходе не показываем.
    const hadSW = !!navigator.serviceWorker.controller;

    // Новый воркер заменил старый → пришла новая версия
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadSW) onNewVersion();
    });

    // Сообщение от нового воркера (шлётся из activate в sw.js)
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'UPDATE_READY' && hadSW) onNewVersion();
    });

// Регистрируем воркер и принудительно проверяем обновление:
    // так игра узнает о новой версии сразу при заходе, а не в фоне.
    navigator.serviceWorker.register('sw.js')
      .then((reg) => reg.update().catch(() => {}))
      .catch(() => {});

    // При возврате в игру (свернули/развернули, переключили окно) — снова проверяем обновление.
    window.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        navigator.serviceWorker.getRegistration().then((r) => r && r.update().catch(() => {}));
      }
    });

    // Периодическая проверка: если обновление вышло, пока игра открыта и игра «потеряла»
    // вкладку (например, стоит в фоне) — табличка появится без перезапуска.
    setInterval(() => {
      navigator.serviceWorker.getRegistration().then((r) => r && r.update().catch(() => {}));
    }, 30 * 60 * 1000);
  });

  // Запасной способ: сверяем версию из manifest.json с той, что игрок уже видел.
  // Обрабатываем отдельно, чтобы не полагаться только на события воркера.
  (function checkManifestVersion() {
    try {
      fetch('./manifest.json', { cache: 'no-store' })
        .then((r) => r.json())
        .then((m) => {
          const v = String(m && m.version != null ? m.version : '');
          if (!v) return;
          const seen = localStorage.getItem(SEENKEY);
          if (seen !== null && seen !== v && localStorage.getItem(PENDKEY) !== '1') onNewVersion();
          localStorage.setItem(SEENKEY, v);   // запоминаем, какую версию предлагаем/показали
        })
        .catch(() => {});
    } catch (_) {}
  })();
}
